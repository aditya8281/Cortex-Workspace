services:
  ollama:
    image: ollama/ollama:latest
    container_name: cortex-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cortex-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: cortex-backend
    env_file:
      - .env
    environment:
      MEMORY_PATH: ${MEMORY_PATH:-/cortex_memory}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////cortex_memory/metadata_db/app.db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-}
      MODEL_API_KEYS: ${MODEL_API_KEYS:-{}}
      CLOUD_PROVIDER_CONFIGS: ${CLOUD_PROVIDER_CONFIGS:-{}}
    volumes:
      - cortex_memory:/cortex_memory
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - ollama
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: cortex-frontend
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "80:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  cortex_memory:
  ollama_data:
