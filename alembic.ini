# Alembic configuration for Cortex Workspace.
#
# sqlalchemy.url is resolved at runtime by migrations/env.py using
# the DATABASE_URL from application settings.  The value below is
# only used as a fallback when env.py cannot resolve the URL.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

# Fallback URL — overridden at runtime by migrations/env.py from DATABASE_URL
sqlalchemy.url = postgresql://cortex:cortex@localhost:5432/cortex

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
