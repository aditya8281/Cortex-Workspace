version: '3.8'

services:
  backend:
    command: ["sh", "-c", "uv run alembic upgrade head && uv run uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload"]
    volumes:
      - .:/app
      - ./app.db:/data/app.db
    environment:
      - DATABASE_URL=sqlite:////data/app.db
      - ENV=development
      - OLLAMA_URL=http://ollama:11434

  frontend:
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    entrypoint: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
