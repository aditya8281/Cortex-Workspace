[package]
name = "cortex-code-intel"
version = "0.1.0"
edition = "2021"

[lib]
name = "cortex_code_intel"
crate-type = ["cdylib"]

[dependencies]
tree-sitter = "0.22"
tree-sitter-python = "0.21"
tree-sitter-javascript = "0.21"
tree-sitter-typescript = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pyo3 = { version = "0.22", features = ["extension-module"] }
